[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "md-toc"
version = "0.1.0"
description = "零依赖的 Markdown 目录（TOC）生成器"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "md-toc contributors" }]
keywords = ["markdown", "toc", "table-of-contents", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/"

[project.scripts]
md-toc = "md_toc.cli:main"

[tool.setuptools.packages.find]
include = ["md_toc*"]
